# Pruebas automáticas en cada push y pull request.
#
# Vercel despliega con cada push aunque una prueba falle: construye, no prueba.
# Esto deja una marca roja en GitHub cuando algo se rompió, para que se note
# antes de que lo note un cliente. No bloquea el despliegue.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps y otros tipos globales los genera Next; sin esto tsc falla en una copia limpia.
      - name: Tipos de Next
        run: npx next typegen
      - name: Tipos
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test
